<div *ngIf="frage$ | async as fragen; else error">
  <ul>
    <li *ngFor="let frage of fragen">
      {{ frage.inhalt }} - {{ frage.art }} - {{ frage.intensitaet }}
    </li>
  </ul>
</div>

<ng-template #error>
  <p>Ein Fehler ist aufgetreten du Lelek</p>
</ng-template>
<router-outlet></router-outlet>
