<hr />
<div class="kategorien-container">Allgemeines <span class="break"></span></div>
<div class="button-container">
  <button
    mat-button
    (click)="toggleButtonSoftAllg()"
    [ngClass]="{
      'disabled-button': isSoftAllgButtonDisabled,
      'enabled-button': !isSoftAllgButtonDisabled
    }"
  >
    {{ isSoftAllgButtonDisabled ? "Sanft" : "Sanft" }}
  </button>

  <button
    mat-button
    (click)="toggleButtonMiddleAllg()"
    [ngClass]="{
      'disabled-button': isMiddleAllgButtonDisabled,
      'enabled-button': !isMiddleAllgButtonDisabled
    }"
  >
    {{ isMiddleAllgButtonDisabled ? "Mittel" : "Mittel" }}
  </button>

  <button
    mat-button
    (click)="toggleButtonHardAllg()"
    [ngClass]="{
      'disabled-button': isHardAllgButtonDisabled,
      'enabled-button': !isHardAllgButtonDisabled
    }"
  >
    {{ isHardAllgButtonDisabled ? "Hart" : "Hart" }}
  </button>
</div>
